<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f2942"/>
      <stop offset="100%" stop-color="#040b14"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="45%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <radialGradient id="dome" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="55%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- app icon canvas -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#sky)"/>

  <!-- stars -->
  <circle cx="22" cy="26" r="1.4" fill="#e0f2fe" opacity="0.8"/>
  <circle cx="100" cy="20" r="1.1" fill="#e0f2fe" opacity="0.6"/>
  <circle cx="108" cy="40" r="1.6" fill="#e0f2fe" opacity="0.7"/>
  <circle cx="18" cy="96" r="1.2" fill="#e0f2fe" opacity="0.5"/>
  <circle cx="30" cy="108" r="1.6" fill="#e0f2fe" opacity="0.7"/>

  <!-- tractor beam -->
  <polygon points="64,58 40,110 88,110" fill="url(#beam)"/>

  <!-- hull -->
  <ellipse cx="64" cy="54" rx="34" ry="10.5" fill="url(#hull)" stroke="#1e293b" stroke-width="1.5"/>
  <!-- cockpit dome -->
  <ellipse cx="64" cy="43" rx="15.5" ry="12" fill="url(#dome)" stroke="#075985" stroke-width="1.5"/>
  <!-- hull underside seam -->
  <path d="M32,54 Q64,68 96,54" fill="none" stroke="#0b1220" stroke-width="1.5" opacity="0.45"/>

  <!-- port lights -->
  <circle cx="48" cy="55.5" r="2.1" fill="#38bdf8"/>
  <circle cx="64" cy="58" r="2.1" fill="#38bdf8"/>
  <circle cx="80" cy="55.5" r="2.1" fill="#38bdf8"/>

  <!-- union-find: two children merging into one root, inside the beam -->
  <line x1="52" y1="90" x2="64" y2="102" stroke="#38bdf8" stroke-width="2.6" stroke-linecap="round"/>
  <line x1="76" y1="90" x2="64" y2="102" stroke="#38bdf8" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="52" cy="90" r="5" fill="#0c2a43" stroke="#38bdf8" stroke-width="2.2"/>
  <circle cx="76" cy="90" r="5" fill="#0c2a43" stroke="#38bdf8" stroke-width="2.2"/>
  <circle cx="64" cy="102" r="6.2" fill="#38bdf8" stroke="#0c2a43" stroke-width="1.8"/>
</svg>
