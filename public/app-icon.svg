<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3567D6"/>
      <stop offset="100%" stop-color="#2850AD"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- union-find: satellite nodes pointing to a shared root -->
  <g stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="14" stroke-linecap="round">
    <line x1="160" y1="150" x2="256" y2="256"/>
    <line x1="352" y1="150" x2="256" y2="256"/>
    <line x1="150" y1="352" x2="256" y2="256"/>
    <line x1="360" y1="356" x2="256" y2="256"/>
  </g>

  <g fill="#FFFFFF">
    <circle cx="160" cy="150" r="34"/>
    <circle cx="352" cy="150" r="34"/>
    <circle cx="150" cy="352" r="34"/>
    <circle cx="360" cy="356" r="34"/>
  </g>

  <!-- root node, accented -->
  <circle cx="256" cy="256" r="56" fill="#F6F5F2"/>
</svg>
